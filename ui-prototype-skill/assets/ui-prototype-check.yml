name: ui-prototype-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve skill path
        id: skill
        run: |
          if [ -d "ui-prototype-skill" ]; then
            echo "path=ui-prototype-skill" >> "$GITHUB_OUTPUT"
          elif [ -d ".skills/ui-prototype" ]; then
            echo "path=.skills/ui-prototype" >> "$GITHUB_OUTPUT"
          else
            echo "Skill directory not found" >&2
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r "${{ steps.skill.outputs.path }}/scripts/requirements.txt"

      - name: Check the checker itself
        working-directory: ${{ steps.skill.outputs.path }}/scripts
        run: python validate_bundle.py --selftest

      - name: Validate bundled examples and page references
        working-directory: ${{ steps.skill.outputs.path }}/scripts
        run: python validate_bundle.py

      - name: Validate every prototype index
        run: |
          set -eu
          SKILL="${{ steps.skill.outputs.path }}"
          for f in .project/prototype/current.yaml "$SKILL"/examples/*/current.yaml; do
            [ -e "$f" ] || continue
            python "$SKILL/scripts/validate_artifact.py" current "$f"
          done

      - name: Prototype pages must open without a build step
        run: |
          set -eu
          python - <<'PY'
          import glob, re, sys

          failures = []
          for path in glob.glob(".project/prototype/pages/**/*.html", recursive=True) + \
                      glob.glob("ui-prototype-skill/examples/*/pages/**/*.html", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
              if re.search(r'(?:src|href)\s*=\s*["\']https?://', text):
                  failures.append(f"{path}: references a remote resource, so it may not open offline")
              if re.search(r'\btype\s*=\s*["\']module["\']', text):
                  failures.append(f"{path}: uses ES modules, which file:// will refuse to load")

          if failures:
              print("Prototype openability check failed:", file=sys.stderr)
              for item in failures:
                  print(f"- {item}", file=sys.stderr)
              raise SystemExit(1)
          print("Prototype openability check passed.")
          PY
